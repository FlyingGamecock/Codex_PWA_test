<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#154734">
    <meta name="description" content="A small offline-ready progressive web app for planning app ideas.">
    <title>Launchpad PWA</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-labelledby="app-title">
        <header class="topbar">
          <div class="brand-lockup">
            <img src="assets/icon.svg" alt="" width="44" height="44">
            <div>
              <p class="eyebrow">Offline-ready</p>
              <h1 id="app-title">Launchpad</h1>
            </div>
          </div>
          <button class="install-button" id="installButton" type="button" hidden>Install</button>
        </header>

        <section class="summary-grid" aria-label="Project summary">
          <article class="metric">
            <span id="totalCount">0</span>
            <p>Total ideas</p>
          </article>
          <article class="metric">
            <span id="readyCount">0</span>
            <p>Ready to build</p>
          </article>
          <article class="metric status-card">
            <span id="offlineStatus">Online</span>
            <p>Network status</p>
          </article>
        </section>

        <form class="idea-form" id="ideaForm">
          <label for="ideaInput">App idea</label>
          <div class="input-row">
            <input id="ideaInput" name="idea" type="text" autocomplete="off" maxlength="80" placeholder="Habit tracker for night-shift nurses" required>
            <button type="submit">Add</button>
          </div>
        </form>

        <section class="board" aria-label="App ideas">
          <div class="board-header">
            <h2>Build Queue</h2>
            <button class="text-button" id="clearDone" type="button">Clear ready</button>
          </div>
          <ul class="idea-list" id="ideaList"></ul>
          <p class="empty-state" id="emptyState">Add the first idea and this PWA will keep it here, even after refresh or while offline.</p>
        </section>
      </section>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
